name: CI

on:
  workflow_call: {}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  test:
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    env:
      IGW_CI_IMAGE: inverter-gateway:ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: test
        run: cargo test --locked --all-targets
      - name: Replay fixed fuzz regression corpus (no fuzz campaign)
        run: |
          cargo fmt --manifest-path fuzz/Cargo.toml -- --check
          cargo clippy --locked --manifest-path fuzz/Cargo.toml --lib -- -D warnings
          cargo test --locked --manifest-path fuzz/Cargo.toml --lib
      - name: Build and smoke test the immutable container
        run: |
          docker build --tag "$IGW_CI_IMAGE" \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" .
          docker run --rm --network none "$IGW_CI_IMAGE" --version
      - name: Export the smoke-tested image with provenance
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/igw-ci-image"
          docker save "$IGW_CI_IMAGE" --output "$RUNNER_TEMP/igw-ci-image/image.tar"
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          output = pathlib.Path(os.environ["RUNNER_TEMP"]) / "igw-ci-image"
          image = json.loads(subprocess.check_output(["docker", "image", "inspect", os.environ["IGW_CI_IMAGE"]]))[0]
          revision = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          assert image["Config"]["Labels"]["org.opencontainers.image.revision"] == revision
          metadata = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "source_head_sha": os.environ["SOURCE_HEAD_SHA"],
              "checkout_sha": revision,
              "checkout_tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
              "image_id": image["Id"], "os": image["Os"], "architecture": image["Architecture"],
          }
          (output / "provenance.json").write_text(json.dumps(metadata, indent=2) + "\n")
          PY
          (cd "$RUNNER_TEMP/igw-ci-image" && sha256sum image.tar provenance.json > SHA256SUMS)
      - name: Retain the tested image for verified deployment
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inverter-gateway-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ runner.arch }}
          path: ${{ runner.temp }}/igw-ci-image/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: Remove this run's temporary image tag
        if: ${{ always() }}
        run: docker image rm "$IGW_CI_IMAGE" || true
    timeout-minutes: 30

  dependency-audit:
    name: Audit locked Rust dependencies
    runs-on: ${{ fromJSON((vars.CI_RUNNER_MODE == 'self-hosted' || vars.CI_RUNNER_MODE == 'k3s') && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || (contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))) && (vars.CI_RUNNER_LABELS || '[]') || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Restore the pinned audit tool
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/cargo-audit-0.22.1/bin/cargo-audit
          key: cargo-audit-0.22.1-${{ runner.os }}-${{ runner.arch }}
      - name: Install the pinned audit tool if needed
        shell: bash
        run: |
          audit_root="$HOME/.cache/cargo-audit-0.22.1"
          if [ ! -x "$audit_root/bin/cargo-audit" ]; then
            cargo install cargo-audit --version '=0.22.1' --locked --root "$audit_root"
          fi
          echo "$audit_root/bin" >> "$GITHUB_PATH"
      - name: Check the committed lock against current RustSec advisories
        run: cargo audit --json
