# Generated by venus-os-ci-toolkit/scripts/install_release.py; edit .release-policy.json.
name: Quality gate
'on':
  pull_request: {}
  merge_group: {}
  workflow_call: {}
permissions:
  contents: read
jobs:
  check-0:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      actions: read
      security-events: write
  check-1:
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      actions: read
      security-events: write
  release-contracts:
    name: Release tooling contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s .github/release-tests -p 'test_*.py' -v
  gate:
    name: CI gate
    needs:
      - check-0
      - check-1
      - release-contracts
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation workflow
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = {name: value['result'] for name, value in results.items() if value['result'] != 'success'}
          if not results or failed:
              raise SystemExit(f'Validation did not pass: {failed}')
          PY
