name: Docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. 0.2.1 or latest)"
        required: true
        default: "latest"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Image tags
        id: meta
        run: |
          set -euo pipefail
          NAME="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
            echo "tags=${{ env.REGISTRY }}/${NAME}:${TAG}" >> "$GITHUB_OUTPUT"
          else
            VERSION="${GITHUB_REF_NAME#v}"
            echo "tags=${{ env.REGISTRY }}/${NAME}:${VERSION},${{ env.REGISTRY }}/${NAME}:latest" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ensure package is public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Repo-linked packages can be flipped public; ignore failures (UI/org policy).
          gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/user/packages/container/inverter-gateway/visibility" \
            -f visibility=public 2>/dev/null || true
          gh api --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/orgs/victron-venus/packages/container/inverter-gateway/visibility" \
            -f visibility=public 2>/dev/null || true
          gh api orgs/victron-venus/packages/container/inverter-gateway --jq .visibility || true

