# Generated by venus-os-ci-toolkit/scripts/install_release.py; edit .release-policy.json.
name: Release pipeline
run-name: "Release ${{ inputs.channel || github.event_name }} \xB7 ${{ github.sha }}"
'on':
  push:
    branches:
      - main
  schedule:
    - cron: 17 4 * * *
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        description: Release channel
        options:
          - nightly
          - beta
          - rc
          - stable
        default: rc
        required: true
      version:
        type: string
        description: Base X.Y.Z (defaults to committed project version)
        required: false
      rc_tag:
        type: string
        description: 'For stable only: checked vX.Y.Z-rc.N'
        required: false
      expected_sha:
        type: string
        description: Optional exact default-branch SHA; the local CLI fills this to detect ref movement
        required: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      channel: ${{ steps.metadata.outputs.channel }}
      version: ${{ steps.metadata.outputs.version }}
      build: ${{ steps.metadata.outputs.build }}
      plan_artifact: ${{ steps.metadata.outputs.plan_artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: metadata
        run: python3 scripts/release_versioned.py prepare --repo "$GITHUB_REPOSITORY"
        env:
          PUBLICATION_ENABLED: ${{ vars.RELEASE_CHANNELS_ENABLED }}
          GH_TOKEN: ${{ github.token }}
      - name: Store exact version plan before building
        if: ${{ steps.metadata.outputs.build == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.metadata.outputs.plan_artifact }}
          path: .release-plan.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
    permissions:
      contents: write
      actions: read
  checks:
    needs: prepare
    if: ${{ needs.prepare.outputs.build == 'true' }}
    uses: ./.github/workflows/quality-gate.yml
    permissions:
      contents: read
      actions: read
      security-events: write
  build:
    needs:
      - prepare
      - checks
    if: ${{ needs.prepare.outputs.build == 'true' }}
    uses: ./.github/workflows/release-build.yml
    permissions:
      contents: read
      actions: read
    with:
      version: ${{ needs.prepare.outputs.version }}
      channel: ${{ needs.prepare.outputs.channel }}
      release_plan_artifact: ${{ needs.prepare.outputs.plan_artifact }}
  gate:
    name: Release gate
    needs:
      - prepare
      - checks
      - build
    if: ${{ always() && needs.prepare.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = {name: value['result'] for name, value in results.items() if value['result'] != 'success'}
          if not results or failed:
              raise SystemExit(f'Release blocked: {failed}')
          PY
  candidate:
    needs:
      - prepare
      - gate
    if: ${{ needs.prepare.outputs.channel != 'stable' && vars.RELEASE_CHANNELS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - &id001
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download the plan used by every build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.prepare.outputs.plan_artifact }}
          path: .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-assets*
          path: .release-download
          merge-multiple: false
      - run: python3 scripts/release.py collect .release-download .release-assets
      - name: Publish checked candidate
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 scripts/release_versioned.py publish --repo "$GITHUB_REPOSITORY" --assets .release-assets
      - name: Store immutable promotion evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-evidence
          path: .release-evidence/release-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
  stable:
    needs: prepare
    if: ${{ needs.prepare.outputs.channel == 'stable' && needs.prepare.outputs.build == 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - *id001
      - name: Promote RC bytes after approval
        env:
          GH_TOKEN: ${{ github.token }}
          RC_TAG: ${{ inputs.rc_tag }}
        run: python3 scripts/release_control.py promote --repo "$GITHUB_REPOSITORY" --rc "$RC_TAG" --run-id "$GITHUB_RUN_ID"
  final:
    needs:
      - prepare
      - gate
    if: ${{ needs.prepare.outputs.channel == 'stable' && needs.prepare.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download the plan used by every build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.prepare.outputs.plan_artifact }}
          path: .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-assets*
          path: .release-download
          merge-multiple: false
      - run: python3 scripts/release.py collect .release-download .release-assets
      - name: Publish the separately validated final packages after approval
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 scripts/release_versioned.py publish --repo "$GITHUB_REPOSITORY" --assets .release-assets
      - name: Store immutable promotion evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-evidence
          path: .release-evidence/release-manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
    environment: release
