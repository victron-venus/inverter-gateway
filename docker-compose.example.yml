services:
  inverter-gateway:
    image: inverter-gateway:latest
    build: .
    container_name: inverter-gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Inside the container the process must listen on 0.0.0.0 so Docker
      # port-publishing works. The host-side mapping stays loopback-only.
      HTTP_BIND: 0.0.0.0:8080
    ports:
      # Never expose 0.0.0.0 on the host — keep this loopback-only so
      # only a local reverse proxy (e.g. Cloudflare Tunnel) can reach it.
      - "127.0.0.1:9150:8080"
    # Cloudflare Tunnel on the host terminates public HTTPS and forwards
    # to http://127.0.0.1:9150.