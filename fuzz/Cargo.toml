[package]
name = "inverter-gateway-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "MIT"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "=0.4.13"
inverter-gateway = { path = ".." }
serde_json = "1"

[patch.crates-io]
rumqttc = { path = "../vendor/rumqttc-0.25.1" }

[[bin]]
name = "energy_sources"
path = "fuzz_targets/energy_sources.rs"
test = false
doc = false
bench = false

[[bin]]
name = "command_payload"
path = "fuzz_targets/command_payload.rs"
test = false
doc = false
bench = false
