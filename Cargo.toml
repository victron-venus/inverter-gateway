[package]
name = "inverter-gateway"
version = "0.1.0"
edition = "2021"
description = "Victron inverter remote gateway — MQTT-to-HTTPS/SSE bridge"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rumqttc = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
futures-util = "0.3"
parking_lot = "0.12"
once_cell = "1"

[dev-dependencies]
tokio-test = "0.4"

[dependencies.tokio-stream]
version = "0.1"
features = ["sync"]
